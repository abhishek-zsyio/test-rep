# Default fallback color variables (prevent config errors if theme is initializing)
$active_border ?= rgba(c4a7e7ff) rgba(eb6f92ff) 45deg
$inactive_border ?= rgba(26233aff)
$bg_color ?= rgb(191724)

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 8
    
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = false
    }
}

cursor {
    no_hardware_cursors = true
}

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }

    sensitivity = 0
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    background_color = $bg_color
}
