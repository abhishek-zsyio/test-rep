# Floating window rules
windowrule = float 1, ^(nwg-look)$
windowrule = float 1, ^(qt5ct)$
windowrule = float 1, ^(qt6ct)$
windowrule = float 1, ^(org.gnome.Nautilus)$
windowrule = float 1, ^(pavucontrol)$
windowrule = float 1, ^(blueman-manager)$
windowrule = float 1, ^(nm-connection-editor)$
windowrule = float 1, title:^(Open File)$
windowrule = float 1, title:^(Save File)$
windowrule = float 1, title:^(Volume Control)$
windowrule = float 1, title:^(Picture-in-Picture)$
windowrule = pin 1, title:^(Picture-in-Picture)$

# Terminal subtle transparency
windowrule = opacity 0.95 0.90, ^(kitty)$

# Prevent idle sleep during video playback
windowrule = idleinhibit focus, ^(mpv)$
windowrule = idleinhibit fullscreen, ^(firefox)$

# Walker Launcher rules
windowrule = float 1, ^(walker)$
windowrule = stayfocused 1, ^(walker)$

# AGS layer rules for blur and animation
layerrule = blur, ags-bar
layerrule = blur, ags-control-center
layerrule = blur, ags-notifications
layerrule = blur, ags-dock
layerrule = blur, ags-overview
layerrule = blur, ags-lockscreen
layerrule = blur, ags-spotlight

layerrule = ignorezero, ags-bar
layerrule = ignorezero, ags-control-center
layerrule = ignorezero, ags-notifications
layerrule = ignorezero, ags-dock
layerrule = ignorezero, ags-overview
layerrule = ignorezero, ags-lockscreen
layerrule = ignorezero, ags-spotlight
