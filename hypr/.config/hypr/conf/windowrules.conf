# Floating window rules (Hyprland 0.55+ Named Category Blocks)
windowrule = float-nwg {
    match:class = ^(nwg-look)$
    float = true
}

windowrule = float-qt5ct {
    match:class = ^(qt5ct)$
    float = true
}

windowrule = float-qt6ct {
    match:class = ^(qt6ct)$
    float = true
}

windowrule = float-nautilus {
    match:class = ^(org.gnome.Nautilus)$
    float = true
}

windowrule = float-pavucontrol {
    match:class = ^(pavucontrol)$
    float = true
}

windowrule = float-blueman {
    match:class = ^(blueman-manager)$
    float = true
}

windowrule = float-nm {
    match:class = ^(nm-connection-editor)$
    float = true
}

windowrule = float-openfile {
    match:title = ^(Open File)$
    float = true
}

windowrule = float-savefile {
    match:title = ^(Save File)$
    float = true
}

windowrule = float-volumecontrol {
    match:title = ^(Volume Control)$
    float = true
}

windowrule = pip-rule {
    match:title = ^(Picture-in-Picture)$
    float = true
    pin = true
}

# Terminal subtle transparency
windowrule = kitty-rule {
    match:class = ^(kitty)$
    opacity = 0.95 0.90
}

# Prevent idle sleep during video playback
windowrule = mpv-rule {
    match:class = ^(mpv)$
    idleinhibit = focus
}

windowrule = firefox-rule {
    match:class = ^(firefox)$
    idleinhibit = fullscreen
}

# Walker Launcher rules
windowrule = walker-rule {
    match:class = ^(walker)$
    float = true
    stayfocused = true
}

# AGS layer rules for blur and animation
layerrule = ags-bar-rule {
    match:namespace = ags-bar
    blur = true
    ignorezero = true
}

layerrule = ags-cc-rule {
    match:namespace = ags-control-center
    blur = true
    ignorezero = true
}

layerrule = ags-notif-rule {
    match:namespace = ags-notifications
    blur = true
    ignorezero = true
}

layerrule = ags-dock-rule {
    match:namespace = ags-dock
    blur = true
    ignorezero = true
}

layerrule = ags-overview-rule {
    match:namespace = ags-overview
    blur = true
    ignorezero = true
}

layerrule = ags-lockscreen-rule {
    match:namespace = ags-lockscreen
    blur = true
    ignorezero = true
}

layerrule = ags-spotlight-rule {
    match:namespace = ags-spotlight
    blur = true
    ignorezero = true
}
