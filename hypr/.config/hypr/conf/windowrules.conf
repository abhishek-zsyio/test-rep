# Floating window rules
windowrule = float-nwg {
    match:class = ^(nwg-look)$
    float = true
}

windowrule = float-qt5ct {
    match:class = ^(qt5ct)$
    float = true
}

windowrule = float-qt6ct {
    match:class = ^(qt6ct)$
    float = true
}

windowrule = float-nautilus {
    match:class = ^(org.gnome.Nautilus)$
    float = true
}

windowrule = float-pavucontrol {
    match:class = ^(pavucontrol)$
    float = true
}

windowrule = float-blueman {
    match:class = ^(blueman-manager)$
    float = true
}

windowrule = float-nm {
    match:class = ^(nm-connection-editor)$
    float = true
}

windowrule = float-openfile {
    match:title = ^(Open File)$
    float = true
}

windowrule = float-savefile {
    match:title = ^(Save File)$
    float = true
}

windowrule = float-volumecontrol {
    match:title = ^(Volume Control)$
    float = true
}

windowrule = pip-rule {
    match:title = ^(Picture-in-Picture)$
    float = true
    pin = true
}

# Terminal subtle transparency
windowrule = kitty-rule {
    match:class = ^(kitty)$
    opacity = 0.95 0.90
}

# Prevent idle sleep during video playback
windowrule = mpv-rule {
    match:class = ^(mpv)$
    idleinhibit = focus
}

windowrule = firefox-rule {
    match:class = ^(firefox)$
    idleinhibit = fullscreen
}

# Walker Launcher rules
windowrule = walker-rule {
    match:class = ^(walker)$
    float = true
    stayfocused = true
}

# AGS layer rules for blur and animation
layerrule = blur, ags-bar
layerrule = ignorezero, ags-bar

layerrule = blur, ags-control-center
layerrule = ignorezero, ags-control-center

layerrule = blur, ags-notifications
layerrule = ignorezero, ags-notifications

layerrule = blur, ags-dock
layerrule = ignorezero, ags-dock

layerrule = blur, ags-overview
layerrule = ignorezero, ags-overview

layerrule = blur, ags-lockscreen
layerrule = ignorezero, ags-lockscreen

layerrule = blur, ags-spotlight
layerrule = ignorezero, ags-spotlight
