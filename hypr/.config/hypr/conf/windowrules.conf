# Floating window rules
windowrule = float, class:^(nwg-look)$
windowrule = float, class:^(qt5ct)$
windowrule = float, class:^(qt6ct)$
windowrule = float, class:^(org.gnome.Nautilus)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, title:^(Open File)$
windowrule = float, title:^(Save File)$
windowrule = float, title:^(Volume Control)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$

# Terminal subtle transparency
windowrule = opacity 0.95 0.90, class:^(kitty)$

# Prevent idle sleep during video playback
windowrule = idleinhibit focus, class:^(mpv)$
windowrule = idleinhibit fullscreen, class:^(firefox)$

# Walker Launcher rules
windowrule = float, class:^(walker)$
windowrule = stayfocused, class:^(walker)$

# AGS layer rules for blur and animation
layerrule = blur, ags-bar
layerrule = blur, ags-control-center
layerrule = blur, ags-notifications
layerrule = blur, ags-dock
layerrule = blur, ags-overview
layerrule = blur, ags-lockscreen
layerrule = blur, ags-spotlight

layerrule = ignorezero, ags-bar
layerrule = ignorezero, ags-control-center
layerrule = ignorezero, ags-notifications
layerrule = ignorezero, ags-dock
layerrule = ignorezero, ags-spotlight
