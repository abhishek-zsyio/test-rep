# Floating window rules (Hyprland 0.55+ Block Syntax)
windowrule {
    match:class = ^(nwg-look)$
    float = true
}

windowrule {
    match:class = ^(qt5ct)$
    float = true
}

windowrule {
    match:class = ^(qt6ct)$
    float = true
}

windowrule {
    match:class = ^(org.gnome.Nautilus)$
    float = true
}

windowrule {
    match:class = ^(pavucontrol)$
    float = true
}

windowrule {
    match:class = ^(blueman-manager)$
    float = true
}

windowrule {
    match:class = ^(nm-connection-editor)$
    float = true
}

windowrule {
    match:title = ^(Open File)$
    float = true
}

windowrule {
    match:title = ^(Save File)$
    float = true
}

windowrule {
    match:title = ^(Volume Control)$
    float = true
}

windowrule {
    match:title = ^(Picture-in-Picture)$
    float = true
    pin = true
}

# Terminal subtle transparency
windowrule {
    match:class = ^(kitty)$
    opacity = 0.95 0.90
}

# Prevent idle sleep during video playback
windowrule {
    match:class = ^(mpv)$
    idleinhibit = focus
}

windowrule {
    match:class = ^(firefox)$
    idleinhibit = fullscreen
}

# Walker Launcher rules
windowrule {
    match:class = ^(walker)$
    float = true
    stayfocused = true
}

# AGS layer rules for blur and animation
layerrule {
    match:namespace = ags-bar
    blur = true
    ignorezero = true
}

layerrule {
    match:namespace = ags-control-center
    blur = true
    ignorezero = true
}

layerrule {
    match:namespace = ags-notifications
    blur = true
    ignorezero = true
}

layerrule {
    match:namespace = ags-dock
    blur = true
    ignorezero = true
}

layerrule {
    match:namespace = ags-overview
    blur = true
    ignorezero = true
}

layerrule {
    match:namespace = ags-lockscreen
    blur = true
    ignorezero = true
}

layerrule {
    match:namespace = ags-spotlight
    blur = true
    ignorezero = true
}
