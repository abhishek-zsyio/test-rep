# Autostart Services & Daemons

# Polkit authentication agent
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || hyprpolkitagent

# UTM / SPICE Guest Clipboard Agent (macOS <-> Arch VM copy-paste)
exec-once = spice-vdagent

# AGS desktop shell
exec-once = ags run ~/.config/ags || ags

# Hypridle idle management
exec-once = hypridle

# Clipboard history daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Restore active theme on launch
exec-once = theme-switch $(cat ~/.cache/current-theme 2>/dev/null || echo "rose-pine")
