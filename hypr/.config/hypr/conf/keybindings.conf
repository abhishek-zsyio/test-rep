#####################
### APP SHORTCUTS ###
#####################
$terminal = kitty
$fileManager = nautilus
$mainMod = SUPER

bind = $mainMod, T, exec, kitty || alacritty || foot
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, exec, firefox
bind = $mainMod, L, exec, ags request lockscreen toggle
bind = $mainMod, Q, killactive,
bind = $mainMod, SPACE, exec, ags request spotlight toggle   # Spotlight Search Launcher
bind = $mainMod SHIFT, SPACE, exec, walker                # Walker Full Application Launcher
bind = $mainMod, BACKSPACE, exec, ags request control-center toggle
bind = $mainMod, SLASH, exec, keybinds                      # Interactive Keybindings Searcher
bind = $mainMod, A, exec, ags request theme-picker toggle
bind = $mainMod+Shift, T, exec, ags request theme-picker toggle
bind = $mainMod+Shift, F, exec, ags request overview toggle

##################################
### WINDOW MANAGEMENT & FOCUS ###
##################################
bind = $mainMod, W, togglefloating,
bind = $mainMod, J, togglesplit,
bind = Alt, Return, fullscreen,

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u

# Resize window
binde = $mainMod+Shift, Right, resizeactive, 30 0
binde = $mainMod+Shift, Left, resizeactive, -30 0
binde = $mainMod+Shift, Up, resizeactive, 0 -30
binde = $mainMod+Shift, Down, resizeactive, 0 30

# Move window around current workspace
bind = $mainMod+Shift+Ctrl, Left, movewindow, l
bind = $mainMod+Shift+Ctrl, Right, movewindow, r
bind = $mainMod+Shift+Ctrl, Up, movewindow, u
bind = $mainMod+Shift+Ctrl, Down, movewindow, d

# Move/resize with mouse & keys
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

################################
### WORKSPACES & SWITCHING  ###
################################
# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Silent move
bind = $mainMod+Alt, 1, movetoworkspacesilent, 1
bind = $mainMod+Alt, 2, movetoworkspacesilent, 2
bind = $mainMod+Alt, 3, movetoworkspacesilent, 3
bind = $mainMod+Alt, 4, movetoworkspacesilent, 4
bind = $mainMod+Alt, 5, movetoworkspacesilent, 5
bind = $mainMod+Alt, 6, movetoworkspacesilent, 6
bind = $mainMod+Alt, 7, movetoworkspacesilent, 7
bind = $mainMod+Alt, 8, movetoworkspacesilent, 8
bind = $mainMod+Alt, 9, movetoworkspacesilent, 9
bind = $mainMod+Alt, 0, movetoworkspacesilent, 10

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

#########################
### MEDIA CONTROLS #####
#########################
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##################################
### BRIGHTNESS & VOLUME KEYS  ###
##################################
bindel = ,XF86AudioRaiseVolume, exec, volume up
bindel = ,XF86AudioLowerVolume, exec, volume down
bindel = ,XF86AudioMute, exec, volume mute
bindel = ,XF86MonBrightnessUp, exec, brightness up
bindel = ,XF86MonBrightnessDown, exec, brightness down

# Function key fallback
bindl  = , F10, exec, volume mute
bindel = , F11, exec, volume down
bindel = , F12, exec, volume up
bind = , F1,  exec, brightness down
bind = , F3,  exec, brightness up

####################
### SCREENSHOTS ####
####################
bindl = $mainMod, P, exec, ags request screenshot toggle
bindl = , Print, exec, ags request screenshot toggle

####################
### MOUSE BUTTONS ###
####################
bind = , mouse:275, exec, spotify       # side button up
bind = , mouse:276, exec, discord       # side button down

####################################
### CLIPBOARD & UTILITIES SHORTCUTS
####################################
bind = SUPER+Shift, V, exec, cliphist list | walker --dmenu | cliphist decode | wl-copy
bind = $mainMod ALT, Right, exec, wallpaper-switch next     # Next wallpaper in active theme
bind = $mainMod ALT, Left, exec, wallpaper-switch prev      # Previous wallpaper in active theme
bind = $mainMod ALT, R, exec, wallpaper-switch random       # Random wallpaper in active theme
